# mpv config for the patched Stremio built-in player (%APPDATA%\stremio-mpv\mpv.conf)
# stremio itself controls hwdec, vo, subtitle position and watch progress; this file adds the rest

# network cache: ~400 MB ahead and 100 MB behind
cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=100MiB

# reconnection. ffmpeg's http client is used on purpose: mpv's newer curl client doesn't retry
# http errors yet (a 503 from the debrid cdn would end the video early).
# - reconnect when the connection drops, when the server closes it early (reconnect_at_eof)
#   and on http 408/429/5xx
# - give up on a connection that stops sending data after 15 s, then reconnect
# measured against a fault-injecting server (tests/network): recovers from all of these in ~20 s
curl-enabled=no
network-timeout=15
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_at_eof=1,reconnect_on_network_error=1,reconnect_on_http_error=%23%408,429,500,502,503,504,reconnect_delay_max=15

# https (debrid cdns). ffmpeg's tls checks certificates but can't read windows' certificate store, so
# without a ca file every https stream fails ("tls: error:0A000086") and stremio spins forever.
# install.cmd exports windows' trusted root certificates to cacert.pem in this folder and adds a
# tls-ca-file line with its full path right below (mpv doesn't expand ~~ there). run install.cmd again
# if it's missing. tls-verify=no would also play them, but without checking who you're talking to.
tls-verify=yes

# fallback in case the track script can't act: english audio and subtitles,
# never default-flagged or forced tracks in other languages
alang=eng,en
slang=eng,en
subs-with-matching-audio=yes
subs-fallback=no
subs-fallback-forced=no

# local IPC pipe: lets install.cmd confirm the player started, and lets you (or an AI agent)
# inspect the player state. any program running as your user could also use it; remove to disable.
input-ipc-server=\\.\pipe\stremio-mpv

# debug log of the last playback. off by default: it records the stream url, which can contain
# your debrid api key. if you turn it on, never share the file without removing the urls.
#log-file=~~/last-playback.log
