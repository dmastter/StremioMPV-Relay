# options for scripts/original-tracks.lua

# subtitle size: 0 = use Stremio's own subtitle size setting (recommended, change it from Stremio's menu).
# any other value forces that mpv sub-scale (Stremio's 100% is about 0.66)
sub_scale=0

# when Stremio uses its default solid subtitle colors, use this opacity instead (1 = leave them solid).
# colors you pick in Stremio's settings are always respected
sub_alpha=0.88

# seconds after a video loads during which Stremio's own track picks are reverted
guard_seconds=30
